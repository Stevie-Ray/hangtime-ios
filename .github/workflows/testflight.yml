name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    env:
      BUNDLE_ID: nl.stevie-ray.hangtime
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SCHEME: HangTime
      WORKSPACE: HangTime.xcworkspace

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]]; then
            echo "::error::The GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > HangTime/GoogleService-Info.plist
          plutil -lint HangTime/GoogleService-Info.plist

          FIREBASE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' HangTime/GoogleService-Info.plist)"
          FIREBASE_PROJECT_ID="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' HangTime/GoogleService-Info.plist)"
          FIREBASE_API_KEY="$(/usr/libexec/PlistBuddy -c 'Print :API_KEY' HangTime/GoogleService-Info.plist)"

          if [[ "$FIREBASE_BUNDLE_ID" != "$BUNDLE_ID" ]]; then
            echo "::error::The Firebase configuration is for the wrong bundle ID."
            exit 1
          fi

          if [[ "$FIREBASE_PROJECT_ID" != "hangtime-app" ]]; then
            echo "::error::The Firebase configuration is for the wrong project."
            exit 1
          fi

          if [[ "$FIREBASE_API_KEY" != A* || ${#FIREBASE_API_KEY} -ne 39 ]]; then
            echo "::error::The Firebase API key has an invalid format."
            exit 1
          fi

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install CocoaPods 1.16.2
        run: sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Show build environment
        run: |
          xcodebuild -version
          pod --version

      - name: Install CocoaPods dependencies
        run: pod _1.16.2_ install --deployment

      - name: Install signing certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/app-store-profile.plist"

          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$PROVISIONING_PROFILE_BASE64" ]]; then
            echo "::error::One or more iOS signing secrets are missing."
            exit 1
          fi

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_BUNDLE_ID="${APPLICATION_IDENTIFIER#*.}"

          if [[ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]]; then
            echo "::error::The provisioning profile is for $PROFILE_BUNDLE_ID, not $BUNDLE_ID."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Set build number
        run: |
          set -euo pipefail
          BUILD_NUMBER="$((1000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using build number $BUILD_NUMBER"

      - name: Configure the app provisioning profile
        run: |
          set -euo pipefail
          PROJECT_FILE="HangTime.xcodeproj/project.pbxproj"

          sed -E -i '' \
            "s/(PROVISIONING_PROFILE_SPECIFIER = )\"[^\"]*\";/\\1\"$PROFILE_NAME\";/g" \
            "$PROJECT_FILE"

          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";" "$PROJECT_FILE"; then
            echo "::error::Failed to configure the HangTime provisioning profile."
            exit 1
          fi

      - name: Archive the app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/HangTime.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive

      - name: Export the IPA
        run: |
          set -euo pipefail
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/export"

          plutil -create xml1 "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_OPTIONS_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HangTime.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

      - name: Save the IPA as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hangtime-ios-testflight
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"

          if [[ -z "$API_KEY_BASE64" || -z "$API_KEY_ID" ]]; then
            echo "::error::The App Store Connect API key secrets are missing."
            exit 1
          fi

          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIRECTORY/AuthKey_${API_KEY_ID}.p8"

      - name: Validate and upload to TestFlight
        env:
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$API_ISSUER_ID" || -z "$API_KEY_ID" ]]; then
            echo "::error::The App Store Connect API authentication secrets are missing."
            exit 1
          fi

          IPA_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print -quit)"

          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No IPA was exported."
            exit 1
          fi

          xcrun altool \
            --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

          xcrun altool \
            --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
